<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet" />
    <title>OpenWiki</title>
    <style>html,body,#root{background:transparent!important;margin:0;padding:0}</style>
    <script>
      (function() {
        // Apply cached dark/light preference to avoid flash on startup.
        var cached = localStorage.getItem('openwiki-theme-resolved');
        if (cached === 'dark') document.documentElement.classList.add('dark');
        // Mark Linux so React renders custom window controls instead of native ones.
        // Must run here (before any JS module evaluates) so App.tsx sees the class.
        if (navigator.platform.toLowerCase().indexOf('linux') !== -1) {
          document.documentElement.classList.add('linux');
        }
      })();
    </script>
  </head>
  <body style="background:transparent!important;margin:0">
    <div id="root" style="background:transparent!important"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
